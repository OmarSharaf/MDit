<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <rect width="760" height="430" rx="16" fill="#f8f9fc"/>

  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1d2e">MDit Architecture</text>
  <text x="380" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a819c">Shared React UI - Desktop adds Tauri + Rust - Web uses browser APIs</text>

  <rect x="130" y="78" width="220" height="54" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="240" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3b5bdb">Web Browser</text>
  <text x="240" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Chrome / Edge</text>

  <rect x="410" y="78" width="220" height="54" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="520" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#7048e8">WebView2 Shell</text>
  <text x="520" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Tauri 2 desktop window</text>

  <line x1="240" y1="132" x2="240" y2="152" stroke="#7048e8" stroke-width="2"/>
  <polygon points="234,152 246,152 240,162" fill="#7048e8"/>
  <line x1="520" y1="132" x2="520" y2="152" stroke="#7048e8" stroke-width="2"/>
  <polygon points="514,152 526,152 520,162" fill="#7048e8"/>

  <rect x="180" y="162" width="400" height="92" rx="14" fill="#3b5bdb" stroke="#3048b0" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">React Frontend (shared)</text>
  <text x="380" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eef0ff">Editor, Preview, Sidebar, Zustand, Export</text>
  <text x="380" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eef0ff">CodeMirror 6, remark/rehype, KaTeX, Mermaid</text>

  <line x1="240" y1="254" x2="240" y2="274" stroke="#7048e8" stroke-width="2"/>
  <polygon points="234,274 246,274 240,284" fill="#7048e8"/>
  <line x1="520" y1="254" x2="520" y2="274" stroke="#7048e8" stroke-width="2"/>
  <polygon points="514,274 526,274 520,284" fill="#7048e8"/>

  <rect x="90" y="284" width="250" height="88" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="215" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3b5bdb">Browser APIs</text>
  <text x="215" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a1d2e">Open file picker</text>
  <text x="215" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a1d2e">Download export, GitHub fetch</text>
  <text x="215" y="362" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">No folder workspace or Git</text>

  <rect x="420" y="284" width="250" height="88" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="545" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0ca678">Tauri IPC + Rust</text>
  <text x="545" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a1d2e">FS read/write, Git status</text>
  <text x="545" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a1d2e">Search, watch, native dialogs</text>
  <text x="545" y="362" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Full workspace support</text>

  <line x1="215" y1="372" x2="215" y2="388" stroke="#c8cede" stroke-width="2"/>
  <line x1="545" y1="372" x2="545" y2="388" stroke="#c8cede" stroke-width="2"/>
  <line x1="215" y1="388" x2="545" y2="388" stroke="#c8cede" stroke-width="2"/>
  <line x1="380" y1="388" x2="380" y2="400" stroke="#7048e8" stroke-width="2"/>
  <polygon points="374,400 386,400 380,410" fill="#7048e8"/>

  <rect x="230" y="412" width="300" height="26" rx="8" fill="#eef0f6" stroke="#dde1ec" stroke-width="2"/>
  <text x="380" y="429" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1a1d2e">Local disk, Git repos, OS file manager</text>
</svg>
