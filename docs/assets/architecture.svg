<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>MDit architecture</title>
  <desc>How the React frontend connects to Tauri and the operating system.</desc>

  <defs>
    <linearGradient id="mdit-arch-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#7048e8"/>
    </linearGradient>
    <marker id="mdit-arch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#7048e8"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="16" fill="#f8f9fc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1a1d2e">MDit Architecture</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7a819c">Shared React UI · Desktop adds Tauri + Rust · Web uses browser APIs</text>

  <rect x="130" y="78" width="220" height="54" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
  <text x="240" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#3b5bdb">Web Browser</text>
  <text x="240" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#7a819c">Chrome / Edge</text>

  <rect x="410" y="78" width="220" height="54" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
  <text x="520" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7048e8">WebView2 Shell</text>
  <text x="520" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#7a819c">Tauri 2 desktop window</text>

  <line x1="240" y1="132" x2="240" y2="158" stroke="#7048e8" stroke-width="2" marker-end="url(#mdit-arch-arrow)"/>
  <line x1="520" y1="132" x2="520" y2="158" stroke="#7048e8" stroke-width="2" marker-end="url(#mdit-arch-arrow)"/>

  <rect x="180" y="158" width="400" height="92" rx="14" fill="url(#mdit-arch-grad)"/>
  <text x="380" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">React Frontend (shared)</text>
  <text x="380" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#eef0ff">Editor · Preview · Sidebar · Zustand · Export</text>
  <text x="380" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#eef0ff">CodeMirror 6 · remark / rehype · KaTeX · Mermaid</text>

  <line x1="240" y1="250" x2="240" y2="278" stroke="#7048e8" stroke-width="2" marker-end="url(#mdit-arch-arrow)"/>
  <line x1="520" y1="250" x2="520" y2="278" stroke="#7048e8" stroke-width="2" marker-end="url(#mdit-arch-arrow)"/>

  <rect x="90" y="278" width="250" height="88" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
  <text x="215" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#3b5bdb">Browser APIs</text>
  <text x="215" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1a1d2e">Open file picker</text>
  <text x="215" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1a1d2e">Download export · GitHub fetch</text>
  <text x="215" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#7a819c">No folder workspace / Git</text>

  <rect x="420" y="278" width="250" height="88" rx="12" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
  <text x="545" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0ca678">Tauri IPC + Rust</text>
  <text x="545" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1a1d2e">FS read/write · Git status</text>
  <text x="545" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1a1d2e">Search · watch · native dialogs</text>
  <text x="545" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#7a819c">Full workspace support</text>

  <line x1="215" y1="366" x2="215" y2="384" stroke="#c8cede" stroke-width="1.5"/>
  <line x1="545" y1="366" x2="545" y2="384" stroke="#c8cede" stroke-width="1.5"/>
  <line x1="215" y1="384" x2="545" y2="384" stroke="#c8cede" stroke-width="1.5"/>
  <line x1="380" y1="384" x2="380" y2="398" stroke="#7048e8" stroke-width="2" marker-end="url(#mdit-arch-arrow)"/>

  <rect x="250" y="402" width="260" height="28" rx="8" fill="#eef0f6" stroke="#dde1ec" stroke-width="1.5"/>
  <text x="380" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1d2e">Local disk · Git repos · OS file manager</text>
</svg>
