<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="MDit architecture">
  <defs>
    <linearGradient id="arch-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#7048e8"/>
    </linearGradient>
    <filter id="arch-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a1d2e" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#f8f9fc" rx="16"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a1d2e">MDit Architecture</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7a819c">React UI · Tauri backend · Local-first files</text>

  <g filter="url(#arch-shadow)">
    <rect x="40" y="88" width="180" height="180" rx="14" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
    <text x="130" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3b5bdb">Frontend</text>
    <rect x="60" y="132" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="130" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">React + TypeScript</text>
    <rect x="60" y="168" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="130" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">CodeMirror 6 Editor</text>
    <rect x="60" y="204" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="130" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">remark / rehype Preview</text>
    <rect x="60" y="240" width="140" height="22" rx="8" fill="#eef0f6"/>
    <text x="130" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">Zustand State</text>
  </g>

  <g filter="url(#arch-shadow)">
    <rect x="270" y="88" width="180" height="180" rx="14" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
    <text x="360" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#7048e8">Desktop Shell</text>
    <rect x="290" y="132" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">Tauri 2 Runtime</text>
    <rect x="290" y="168" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="360" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">Native Dialogs</text>
    <rect x="290" y="204" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="360" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">File System API</text>
    <rect x="290" y="240" width="140" height="22" rx="8" fill="#eef0f6"/>
    <text x="360" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">WebView2 Window</text>
  </g>

  <g filter="url(#arch-shadow)">
    <rect x="500" y="88" width="180" height="180" rx="14" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
    <text x="590" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0ca678">Rust Backend</text>
    <rect x="520" y="132" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="590" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">FS Operations</text>
    <rect x="520" y="168" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="590" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">Git Status</text>
    <rect x="520" y="204" width="140" height="28" rx="8" fill="#eef0f6"/>
    <text x="590" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">Directory Search</text>
    <rect x="520" y="240" width="140" height="22" rx="8" fill="#eef0f6"/>
    <text x="590" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1d2e">File Watchers</text>
  </g>

  <path d="M220 178 H270" stroke="url(#arch-acc)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="270,178 262,173 262,183" fill="#7048e8"/>
  <path d="M450 178 H500" stroke="url(#arch-acc)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="500,178 492,173 492,183" fill="#7048e8"/>
</svg>
