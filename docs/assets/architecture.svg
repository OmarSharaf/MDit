<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
  <rect width="640" height="340" rx="14" fill="#f8f9fc"/>
  <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1d2e">MDit Architecture</text>
  <text x="320" y="46" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a819c">One React UI - Web and Desktop targets</text>

  <rect x="40" y="62" width="250" height="48" rx="10" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="165" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#3b5bdb">Web Browser</text>
  <text x="165" y="98" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Chrome / Edge</text>

  <rect x="350" y="62" width="250" height="48" rx="10" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="475" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#7048e8">WebView2 + Tauri 2</text>
  <text x="475" y="98" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Desktop shell</text>

  <rect x="40" y="124" width="560" height="56" rx="10" fill="#3b5bdb" stroke="#3048b0" stroke-width="2"/>
  <text x="320" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">React Frontend</text>
  <text x="320" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">Editor, Preview, Sidebar, Export, Zustand</text>

  <rect x="40" y="196" width="250" height="56" rx="10" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="165" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#3b5bdb">Browser APIs</text>
  <text x="165" y="236" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Files, export, GitHub import</text>

  <rect x="350" y="196" width="250" height="56" rx="10" fill="#ffffff" stroke="#dde1ec" stroke-width="2"/>
  <text x="475" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0ca678">Tauri IPC + Rust</text>
  <text x="475" y="236" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">FS, Git, search, dialogs</text>

  <rect x="40" y="268" width="560" height="48" rx="10" fill="#eef0f6" stroke="#dde1ec" stroke-width="2"/>
  <text x="320" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a1d2e">Local disk and Git repositories</text>
  <text x="320" y="304" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a819c">Desktop path only for full workspace features</text>
